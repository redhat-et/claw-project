apiVersion: v1
kind: Pod
metadata:
  name: claw-api-check
  labels:
    app.kubernetes.io/name: claw-redteam
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: docker.io/curlimages/curl@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
      command:
        - /bin/sh
        - -ceu
        - |
          curl -fsS -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"model":"openclaw/default","messages":[{"role":"user","content":"Reply only with READY"}]}' \
            "${OPENCLAW_GATEWAY_URL}/v1/chat/completions"
      env:
        - name: OPENCLAW_GATEWAY_URL
          valueFrom:
            configMapKeyRef:
              name: claw-redteam-runtime
              key: OPENCLAW_GATEWAY_URL
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: claw-redteam-secrets
              key: OPENCLAW_GATEWAY_TOKEN
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
