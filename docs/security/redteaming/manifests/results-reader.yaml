apiVersion: v1
kind: Pod
metadata:
  name: claw-redteam-results
  labels:
    app.kubernetes.io/name: claw-redteam-results-reader
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      # The full UBI image includes tar, which `oc cp` requires.
      image: registry.access.redhat.com/ubi9/ubi:9.6
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: results
          mountPath: /results
          readOnly: true
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: claw-redteam-results
